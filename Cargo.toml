[package]
name = "cmdkim"
version = "0.2.0"
edition = "2021"
rust-version = "1.67.0"
description = "Implementation of the DomainKeys Identified Mail (DKIM) specification"
license = "GPL-3.0-or-later"
categories = ["cryptography", "email"]
keywords = ["dkim", "email", "smtp"]
repository = "https://github.com/chatmail/cmdkim"
exclude = [".github"]

[dependencies]
base64ct = { version = "1.6.0", features = ["alloc"] }
digest = "0.11"
ed25519-dalek = { version = "3.0", features = ["pkcs8"] }
n0-dns-resolver = { version = "0.1", default-features = false, optional = true }
idna = "1.1.0"
pkcs8 = { version = "0.11", features = ["pem"] }
rsa = { version = "0.10", features = ["pkcs1v15"] }
sha2 = { version = "0.11", features = ["oid"] }
tokio = { version = "1.37.0", features = ["rt", "time"] }
tracing = "0.1.40"

[dev-dependencies]
rand = "0.8.5"
tokio = { version = "1.37.0", features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "test-util",
] }
tracing-subscriber = "0.3.18"

[[test]]
name = "live"
required-features = ["n0-dns-resolver"]

[[example]]
name = "dkimverify"
required-features = ["n0-dns-resolver"]

[package.metadata.docs.rs]
features = ["n0-dns-resolver"]
